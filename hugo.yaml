params:
  # Datos de contacto usados por la barra de navegación, el pie y los shortcodes qa/*
  contact:
    phone: "947 27 31 01"
    phoneIntl: "(+34) 947 27 31 01"
    phoneLink: "+34947273101"
    address: "c/ Santander 11, 2º C, 09004 Burgos"
    maps: "https://maps.app.goo.gl/tUnp3YdsnFdcqDZM7"
    form: "https://forms.office.com/e/H4qwDRuGdY"

  description: Abogados en Burgos. 947 273 101. En Quintana Abogados contamos con más de 40 años de experiencia en el ejercicio de la Abogacía en Burgos capital. Actualmente forman parte de nuestro despacho los abogados Cándido Quintana Núñez y Pablo Quintana Jabato.

  navbar:
    displayTitle: false
    displayLogo: true
    # Botón del teléfono en la barra (true = se muestra, false = se oculta)
    displayPhone: true
    logo:
      path: images/logo.png
      dark: images/logo_oscuro.png
      link: /
      width: 187.5
      height: 56.25

  page:
    # full (100%), wide (90rem), normal (80rem)
    width: normal

  theme:
    # light | dark | system
    default: light
    displayToggle: true

  footer:
    enable: true
    displayCopyright: true
    displayPoweredBy: false
    width: full

  # Display the last modification date
  displayUpdatedDate: false
  # Fecha larga localizada por idioma ("7 de octubre de 2026", "October 7, 2026", "7 octobre 2026")
  dateFormat: ":date_long"

  # Search
  # flexsearch is enabled by default
  search:
    enable: false
    type: flexsearch

    flexsearch:
      # index page by: content | summary | heading | title
      index: heading
      # full | forward | reverse | strict
      # https://github.com/nextapps-de/flexsearch/#tokenizer-prefix-search
      tokenize: forward

  editURL:
    enable: false
    base: "https://github.com/imfing/hextra/edit/main/exampleSite/content"

  blog:
    list:
      displayTags: true
      # date | lastmod | publishDate | title | weight
      sortBy: date
      sortOrder: desc # or "asc"

    article:
      displayPagination: false

  highlight:
    copy:
      enable: false
      # hover | always
      display: hover

  comments:
    enable: false
    type: giscus
  
